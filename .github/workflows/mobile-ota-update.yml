name: Mobile OTA Update

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "!mobile/**.md"

defaults:
  run:
    working-directory: mobile

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Publish OTA update
        # The current EAS CLI rejects --branch + --channel together, and --auto
        # conflicts with an explicit --branch. This workflow only ever runs on
        # push to main and always targets production, so name the branch
        # directly (the `production` channel maps to it, set at build time in
        # eas.json) and carry the commit subject as the update message.
        run: eas update --branch production --message "${{ github.event.head_commit.message }}" --non-interactive
