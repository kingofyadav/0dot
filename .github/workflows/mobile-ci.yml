name: Mobile CI

on:
  pull_request:
    paths:
      - "mobile/**"
      - "!mobile/**.md"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "!mobile/**.md"

defaults:
  run:
    working-directory: mobile

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test
