name: Database backup

# Daily off-site backup of the remote Turso production DB — see
# scripts/backup-remote-db.mjs and docs/deploy/BACKUPS.md. Runs after the
# native Vercel daily cron (vercel.json, 03:23 UTC) so the backup doesn't
# race that job's DB writes.
#
# Requires repo secrets (Settings → Secrets and variables → Actions):
#   DATABASE_URL          same value as the Vercel Production env var
#   DATABASE_AUTH_TOKEN   same value as the Vercel Production env var
#   BLOB_READ_WRITE_TOKEN same value as the Vercel Production env var
# These are Vercel env vars already — copy them over, they are not created
# by this workflow.

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      BACKUP_DB_LABEL: "0dot-app-in"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install turso CLI
        run: curl -sSfL https://get.tur.so/install.sh | bash && echo "$HOME/.turso" >> "$GITHUB_PATH"

      - name: Run backup
        run: node scripts/backup-remote-db.mjs
