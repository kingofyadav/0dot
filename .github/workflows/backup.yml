name: Database backup

# Daily off-site backup of the remote Turso production DB — see
# scripts/backup-remote-db.mjs and docs/deploy/BACKUPS.md. Runs after the
# native Vercel daily cron (vercel.json, 03:23 UTC) so the backup doesn't
# race that job's DB writes.
#
# Requires repo secrets (Settings → Secrets and variables → Actions), not
# created by this workflow:
#   DATABASE_URL          Turso DB URL — `turso db show <db-name> --url`
#   DATABASE_AUTH_TOKEN   a FULL-ACCESS Turso token for that DB — mint with
#                          `turso db tokens create <db-name> --expiration
#                          never` (NOT --read-only, see
#                          scripts/backup-remote-db.mjs's header comment).
#                          Vercel's own copy is a "Sensitive" env var and
#                          can't be read back via the CLI/API even by the
#                          owner, so it can't just be copied from there.
#   BLOB_READ_WRITE_TOKEN same value as the Vercel Production env var

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      BACKUP_DB_LABEL: "dot-0-database"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Install turso CLI
        run: curl -sSfL https://get.tur.so/install.sh | bash && echo "$HOME/.turso" >> "$GITHUB_PATH"

      - name: Run backup
        run: node scripts/backup-remote-db.mjs
